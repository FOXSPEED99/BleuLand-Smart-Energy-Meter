; SEM-1 firmware build settings.
;
; Pick the target with the env selector at the bottom of VS Code
; (or: pio run -e devkit / pio run -e c3).
;   devkit  -> the prototype you have now (ESP32-DevKitC + SCT-013-030 CT)
;   c3      -> production board (ESP32-C3-WROOM-02 + SCT-013-000 CT)
;   native  -> unit tests on your PC (pio test -e native)

[platformio]
default_envs = devkit

[env]
platform = espressif32@6.9.0        ; = Arduino core 2.0.17 (pinned: every build is identical)
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_sem1.csv
lib_deps = bblanchon/ArduinoJson@7.2.1
build_flags =
  -D SEM1_FW_VERSION=\"0.1.0\"
test_ignore = test_core              ; PC-only tests, see env:native

[env:devkit]
board = esp32dev
monitor_filters = esp32_exception_decoder
build_flags =
  ${env.build_flags}
  -D SEM1_BOARD_DEVKIT
  ; prototype CT: SCT-013-030 (30 A / 1 V, 1800 turns, ~62 R inside), R14 = 2 x R220
  -D SEM1_CT_TURNS=1800.0f
  -D SEM1_CT_INT_BURDEN=62.0f
  -D SEM1_R14_OHMS=0.44f

[env:c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
  ${env.build_flags}
  -D SEM1_BOARD_C3
  ; serial console over the C3's built-in USB (GPIO18/19)
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; production CT: SCT-013-000 (100 A : 50 mA, 2000 turns), R14 = 0.5 R  -> defaults in config.h

[env:native]
platform = native
test_framework = unity
test_ignore =
lib_deps =
build_src_filter = -<*>
build_flags = -std=gnu++17
